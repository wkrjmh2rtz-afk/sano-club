<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佐野クラブ 選手評価</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@700&display=swap');
:root{--navy:#0a1628;--navy2:#132040;--gold:#f5a623;--gold2:#ffc84a;--red:#e63946;--green:#2dc653;--blue:#3a86ff;--purple:#7c3aed;--gray:#8899aa;--light:#e8f0f8;--card:#162035;--border:#1e3050;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--navy);color:#fff;min-height:100vh;padding-bottom:80px;font-size:14px;}
header{background:linear-gradient(135deg,var(--navy2),#0d1e38);border-bottom:3px solid var(--gold);padding:12px 16px;position:sticky;top:0;z-index:50;}
.hrow{display:flex;align-items:center;gap:10px;}
.logo{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--navy);flex-shrink:0;}
.htitle h1{font-family:'Oswald',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;}
.htitle p{font-size:10px;color:var(--gray);margin-top:1px;}
.section{display:none;padding:14px;}.section.active{display:block;}
.sec-title{font-size:11px;color:var(--gray);font-weight:700;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy2);border-top:1px solid var(--border);display:flex;z-index:100;}
.nb{flex:1;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;border:none;background:none;color:var(--gray);font-size:8px;font-family:inherit;transition:color .2s;}
.nb.active{color:var(--gold);}
.nb .ic{font-size:18px;}

/* CARDS */
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--border);}
.card-title{font-size:12px;color:var(--gray);font-weight:700;margin-bottom:10px;}

/* INPUTS */
select,input[type=text],input[type=date],input[type=number]{background:var(--navy2);border:1px solid var(--border);color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit;}
select:focus,input:focus{outline:2px solid var(--gold);}
textarea{background:var(--navy2);border:1px solid var(--border);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;resize:vertical;}
textarea:focus{outline:2px solid var(--gold);}

/* BUTTONS */
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;margin-top:8px;letter-spacing:1px;}
.btn:active{transform:scale(.97);}
.btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--navy);box-shadow:0 4px 15px rgba(245,166,35,.3);}
.btn-outline{background:var(--navy2);color:var(--gold);border:2px solid var(--gold)!important;}
.btn-blue{background:linear-gradient(90deg,var(--blue),#60a5fa);color:#fff;}
.btn-green{background:linear-gradient(90deg,var(--green),#4ade80);color:var(--navy);}
.btn-red{background:linear-gradient(90deg,var(--red),#f87171);color:#fff;}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;border:none;font-family:inherit;font-weight:700;cursor:pointer;}
.btn-sm-gold{background:var(--gold);color:var(--navy);}
.btn-sm-outline{background:none;color:var(--gold);border:1px solid var(--gold)!important;}
.btn-sm-red{background:none;color:var(--red);border:1px solid var(--red)!important;}

/* SCORE BTNS */
.sbwrap{display:flex;gap:4px;}
.sb{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;background:var(--navy2);color:var(--gray);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.sb:hover{transform:scale(1.1);}
.s-maru2{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 0 6px #7c3aed88;}
.s-maru{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.s-sankaku{background:#60a5fa;color:var(--navy);border-color:#60a5fa;}
.s-batsu{background:var(--red);color:#fff;border-color:var(--red);}

/* PLAYER LIST */
.pcard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:8px;}
.pava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:14px;flex-shrink:0;}
.pname{font-size:14px;font-weight:700;}
.pgrade{font-size:10px;color:var(--gray);}

/* EVAL ROWS */
.eval-row{display:flex;align-items:center;background:var(--navy);padding:10px 14px;gap:10px;}
.eval-row:not(:last-child){border-bottom:1px solid var(--border);}
.eval-label{font-size:12px;flex:1;color:var(--light);}

/* BAR */
.bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
.bar{height:100%;border-radius:4px;transition:width .4s;}
.bar-gold{background:linear-gradient(90deg,var(--gold),var(--gold2));}
.bar-blue{background:linear-gradient(90deg,var(--blue),#60a5fa);}
.bar-green{background:linear-gradient(90deg,var(--green),#4ade80);}
.bar-red{background:linear-gradient(90deg,var(--red),#f87171);}
.bar-purple{background:linear-gradient(90deg,var(--purple),#a78bfa);}

/* RANK */
.rank-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border);margin-bottom:8px;}
.rank-no{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;width:32px;text-align:center;color:var(--gray);}
.rank-no.gold{color:var(--gold);}.rank-no.silver{color:#c0c0c0;}.rank-no.bronze{color:#cd7f32;}
.rank-score{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--gold);}
.rank-score span{font-size:11px;color:var(--gray);}

/* TABS (inner) */
.itabs{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;}
.itab{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--navy);color:var(--gray);white-space:nowrap;font-family:inherit;}
.itab.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}

/* BADGE */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-blue{background:#1e3a5f;color:#60a5fa;}
.badge-green{background:#1a2e1a;color:#4ade80;}
.badge-red{background:#2e1a1a;color:#f87171;}
.badge-gold{background:#2e2200;color:var(--gold);}

/* SCORE PILL */
.spill{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;}
.spill.hi{color:#4ade80;}.spill.mid{color:var(--gold);}.spill.lo{color:var(--red);}

/* CHART */
canvas{display:block;width:100%!important;max-width:100%;}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:var(--navy);padding:10px 20px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.row2{display:flex;gap:8px;}
.row2>*{flex:1;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.empty{text-align:center;color:var(--gray);padding:24px;font-size:13px;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">佐野</div>
    <div class="htitle">
      <h1>SANO CLUB 選手評価</h1>
      <p>背番号・出場時間・成長管理システム</p>
    </div>
  </div>
</header>

<!-- ===== HOME ===== -->
<div id="sec-home" class="section active">
  <p class="sec-title">📊 総合評価ダッシュボード</p>
  <div id="home-list"></div>
</div>

<!-- ===== 練習姿勢 ===== -->
<div id="sec-practice" class="section">
  <p class="sec-title">🏋️ 練習姿勢 取込・管理</p>
  <div class="card">
    <div class="card-title">📥 LINEデータ取込（チェック表の集計用データを貼付）</div>
    <textarea id="lineInput" rows="8" placeholder="例：
阿部　蒼太｜89%
岩田　圭大郎｜72%
..."></textarea>
    <div class="row2" style="margin-top:8px">
      <input type="date" id="lineDate">
      <input type="text" id="lineCoach" placeholder="担当コーチ名">
    </div>
    <button class="btn btn-gold" onclick="importLine()">📥 取込む</button>
  </div>
  <div class="card">
    <div class="card-title">📋 取込履歴</div>
    <div id="practice-history"></div>
  </div>
</div>

<!-- ===== 出席 ===== -->
<div id="sec-attend" class="section">
  <p class="sec-title">📅 出席管理</p>
  <div class="card">
    <div class="card-title">➕ 練習日を記録</div>
    <div class="row2">
      <input type="date" id="attendDate">
      <select id="attendType">
        <option value="practice">練習</option>
        <option value="game">試合</option>
      </select>
    </div>
    <p style="font-size:11px;color:var(--gray);margin:8px 0 6px">出席した選手にチェック</p>
    <div id="attend-checkboxes"></div>
    <button class="btn btn-gold" onclick="saveAttend()">💾 出席を保存</button>
  </div>
  <div class="card">
    <div class="card-title">📊 出席率一覧</div>
    <div id="attend-summary"></div>
  </div>
</div>

<!-- ===== 試合評価 ===== -->
<div id="sec-game" class="section">
  <p class="sec-title">🏀 試合評価</p>
  <div class="card">
    <div class="row2">
      <input type="date" id="gameDate">
      <input type="text" id="gameOpp" placeholder="相手チーム">
    </div>
    <select id="gamePlayer" style="width:100%;margin-top:8px"></select>
    <div style="margin-top:12px" id="game-eval-rows"></div>
    <textarea id="gameComment" rows="2" placeholder="コメント" style="margin-top:8px"></textarea>
    <button class="btn btn-gold" onclick="saveGameEval()">💾 評価を保存</button>
  </div>
  <div class="card">
    <div class="card-title">📋 試合評価履歴</div>
    <select id="gameHistPlayer" style="width:100%;margin-bottom:10px" onchange="renderGameHist()">
      <option value="">全選手</option>
    </select>
    <div id="game-hist"></div>
  </div>
</div>

<!-- ===== 成長グラフ ===== -->
<div id="sec-growth" class="section">
  <p class="sec-title">📈 成長推移グラフ</p>
  <div class="card">
    <select id="growthPlayer" style="width:100%;margin-bottom:12px" onchange="renderGrowth()"></select>
    <div class="itabs" id="growth-tabs">
      <button class="itab active" onclick="setGrowthTab('practice',this)">練習姿勢</button>
      <button class="itab" onclick="setGrowthTab('game',this)">試合評価</button>
      <button class="itab" onclick="setGrowthTab('total',this)">総合評価</button>
    </div>
    <canvas id="growthChart" height="200"></canvas>
  </div>
</div>

<!-- ===== ランキング ===== -->
<div id="sec-rank" class="section">
  <p class="sec-title">🏆 ランキング</p>
  <div class="itabs">
    <button class="itab active" onclick="setRankTab('total',this)">総合評価</button>
    <button class="itab" onclick="setRankTab('number',this)">背番号参考</button>
    <button class="itab" onclick="setRankTab('playtime',this)">出場時間参考</button>
  </div>
  <div id="rank-list"></div>
  <div class="card" style="margin-top:4px">
    <div class="card-title" style="margin-bottom:6px">📌 評価の重み</div>
    <div style="font-size:11px;color:var(--gray);line-height:1.8">
      練習姿勢 <b style="color:var(--gold)">40%</b>　出席率 <b style="color:var(--blue)">20%</b>　試合評価 <b style="color:var(--green)">40%</b>
    </div>
  </div>
</div>

<!-- ===== 選手管理 ===== -->
<div id="sec-players" class="section">
  <p class="sec-title">👤 選手管理</p>
  <div class="card">
    <div class="row2">
      <input type="text" id="newName" placeholder="名前">
      <select id="newGrade">
        <option value="1">1年</option><option value="2">2年</option><option value="3">3年</option>
        <option value="4">4年</option><option value="5" selected>5年</option><option value="6">6年</option>
      </select>
    </div>
    <button class="btn btn-gold" onclick="addPlayer()" style="margin-top:8px">＋ 追加</button>
  </div>
  <div id="player-list"></div>
  <button class="btn btn-outline" onclick="saveHTML()" style="margin-top:4px">💾 データを保存する（HTMLダウンロード）</button>
</div>

<nav class="bnav">
  <button class="nb active" onclick="showSec('home',this)"><span class="ic">📊</span>ホーム</button>
  <button class="nb" onclick="showSec('practice',this)"><span class="ic">🏋️</span>練習</button>
  <button class="nb" onclick="showSec('attend',this)"><span class="ic">📅</span>出席</button>
  <button class="nb" onclick="showSec('game',this)"><span class="ic">🏀</span>試合</button>
  <button class="nb" onclick="showSec('growth',this)"><span class="ic">📈</span>成長</button>
  <button class="nb" onclick="showSec('rank',this)"><span class="ic">🏆</span>順位</button>
  <button class="nb" onclick="showSec('players',this)"><span class="ic">👤</span>選手</button>
</nav>
<div class="toast" id="toast"></div>

<script id="embedded-data" type="application/json">
{"players":[{"id":"p1","name":"阿部　蒼太","grade":6},{"id":"p2","name":"岩田　圭大郎","grade":5},{"id":"p3","name":"岩田　壮大郎","grade":5},{"id":"p4","name":"鈴木　奏都","grade":5},{"id":"p5","name":"渡邊　結仁","grade":5},{"id":"p6","name":"高橋　立希","grade":5},{"id":"p7","name":"浦野　壱地","grade":5},{"id":"p8","name":"渡邊　圭","grade":3},{"id":"p9","name":"阿部　蒼","grade":4}],"practiceRecords":[],"attendRecords":[],"gameRecords":[]}
</script>

<script>
// ===== CONSTANTS =====
const SYMS=['◎','○','△','×'];
const SYM_CLS={'◎':'s-maru2','○':'s-maru','△':'s-sankaku','×':'s-batsu'};
const PTS={'◎':3,'○':2,'△':1,'×':0};
const GAME_ITEMS=['ワンアーム','ヘルプ','ボックスアウト','パス＆ラン','リング近くのシュート','周りを見る','突っ込みすぎない','声'];
let growthTab='practice', rankTab='total';

// ===== STATE =====
let players=[], practiceRecords=[], attendRecords=[], gameRecords=[];
let gameEvalState={};

// ===== LOAD =====
function loadData(){
  try{
    const raw=document.getElementById('embedded-data').textContent.trim();
    if(raw&&raw!=='__EMBEDDED_DATA__'){
      const d=JSON.parse(raw);
      players=d.players||[];
      practiceRecords=d.practiceRecords||[];
      attendRecords=d.attendRecords||[];
      gameRecords=d.gameRecords||[];
      return;
    }
  }catch(e){}
  players=[];practiceRecords=[];attendRecords=[];gameRecords=[];
}

// ===== SAVE =====
function saveHTML(){
  const data={players,practiceRecords,attendRecords,gameRecords};
  const json=JSON.stringify(data);
  const html=document.documentElement.outerHTML;
  const updated=html.replace(
    /(<script id="embedded-data"[^>]*>)([\s\S]*?)(<\/script>)/,
    `$1\n${json}\n$3`
  );
  const blob=new Blob([updated],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`sano_hyoka_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  showToast('💾 保存しました！');
}

// ===== CALC =====
function calcPracticeAvg(pid){
  const recs=practiceRecords.filter(r=>r.playerId===pid);
  if(!recs.length)return null;
  const avg=recs.reduce((s,r)=>s+r.score,0)/recs.length;
  return Math.round(avg);
}

function calcAttendRate(pid){
  if(!attendRecords.length)return null;
  const total=attendRecords.length;
  const present=attendRecords.filter(r=>r.present.includes(pid)).length;
  return Math.round(present/total*100);
}

function calcGameAvg(pid){
  const recs=gameRecords.filter(r=>r.playerId===pid);
  if(!recs.length)return null;
  const avg=recs.reduce((s,r)=>s+r.total,0)/recs.length;
  return Math.round(avg);
}

function calcTotal(pid){
  const p=calcPracticeAvg(pid);
  const a=calcAttendRate(pid);
  const g=calcGameAvg(pid);
  let score=0, weight=0;
  if(p!==null){score+=p*0.4;weight+=0.4;}
  if(a!==null){score+=a*0.2;weight+=0.2;}
  if(g!==null){score+=g*0.4;weight+=0.4;}
  if(weight===0)return null;
  return Math.round(score/weight*100)/100;
}

function scoreColor(v){
  if(v===null)return'var(--gray)';
  return v>=70?'#4ade80':v>=40?'var(--gold)':'var(--red)';
}
function pillClass(v){
  if(v===null)return'';
  return v>=70?'hi':v>=40?'mid':'lo';
}

// ===== NAV =====
function showSec(name,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='home')renderHome();
  if(name==='attend'){renderAttendCheckboxes();renderAttendSummary();}
  if(name==='game'){renderGameEvalRows();refreshGameDropdowns();}
  if(name==='growth'){refreshGrowthDropdown();renderGrowth();}
  if(name==='rank')renderRanking();
  if(name==='practice')renderPracticeHistory();
  if(name==='players')renderPlayerList();
}

// ===== HOME =====
function renderHome(){
  const list=document.getElementById('home-list');
  if(!players.length){list.innerHTML='<div class="empty">👤 選手タブから選手を登録してください</div>';return;}
  list.innerHTML=players.map(p=>{
    const pr=calcPracticeAvg(p.id);
    const at=calcAttendRate(p.id);
    const gm=calcGameAvg(p.id);
    const tot=calcTotal(p.id);
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div class="pava">${p.name.trim()[0]}</div>
        <div style="flex:1"><div class="pname">${p.name}</div><div class="pgrade">${p.grade}年生</div></div>
        <div style="text-align:right">
          <div style="font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:${scoreColor(tot)}">${tot!==null?Math.round(tot)+'':'--'}</div>
          <div style="font-size:9px;color:var(--gray)">総合スコア</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
        <div style="background:var(--navy2);border-radius:8px;padding:8px">
          <div style="font-size:10px;color:var(--gray)">🏋️練習姿勢</div>
          <div class="spill ${pillClass(pr)}" style="font-size:18px">${pr!==null?pr+'%':'--'}</div>
          <div style="font-size:9px;color:var(--gray)">×40%</div>
        </div>
        <div style="background:var(--navy2);border-radius:8px;padding:8px">
          <div style="font-size:10px;color:var(--gray)">📅出席率</div>
          <div class="spill ${pillClass(at)}" style="font-size:18px">${at!==null?at+'%':'--'}</div>
          <div style="font-size:9px;color:var(--gray)">×20%</div>
        </div>
        <div style="background:var(--navy2);border-radius:8px;padding:8px">
          <div style="font-size:10px;color:var(--gray)">🏀試合評価</div>
          <div class="spill ${pillClass(gm)}" style="font-size:18px">${gm!==null?gm+'%':'--'}</div>
          <div style="font-size:9px;color:var(--gray)">×40%</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ===== PRACTICE =====
function importLine(){
  const text=document.getElementById('lineInput').value.trim();
  const date=document.getElementById('lineDate').value||new Date().toISOString().slice(0,10);
  const coach=document.getElementById('lineCoach').value||'未入力';
  if(!text){showToast('⚠ データを貼り付けてください');return;}

  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let imported=0;
  lines.forEach(line=>{
    const m=line.match(/^(.+?)[\|｜](\d+)%/);
    if(!m)return;
    const name=m[1].trim();
    const score=parseInt(m[2]);
    const p=players.find(pl=>pl.name.replace(/\s/g,'')===name.replace(/\s/g,''));
    if(!p)return;
    practiceRecords.push({id:'pr'+Date.now()+Math.random(),playerId:p.id,date,coach,score});
    imported++;
  });
  if(imported===0){showToast('⚠ 一致する選手が見つかりませんでした');return;}
  document.getElementById('lineInput').value='';
  renderPracticeHistory();
  showToast(`✅ ${imported}名分取込みました`);
}

function renderPracticeHistory(){
  const el=document.getElementById('practice-history');
  if(!practiceRecords.length){el.innerHTML='<div class="empty">データなし</div>';return;}
  const sorted=[...practiceRecords].sort((a,b)=>b.date.localeCompare(a.date));
  // group by date
  const byDate={};
  sorted.forEach(r=>{
    if(!byDate[r.date])byDate[r.date]=[];
    byDate[r.date].push(r);
  });
  el.innerHTML=Object.entries(byDate).map(([date,recs])=>{
    const rows=recs.map(r=>{
      const p=players.find(x=>x.id===r.playerId);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12px">${p?p.name:'不明'}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="spill ${pillClass(r.score)}" style="font-size:14px">${r.score}%</span>
          <button class="btn-sm btn-sm-red" onclick="deletePracticeRec('${r.id}')">×</button>
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px">${date}　<span style="color:var(--gray);font-weight:400">${recs[0].coach}</span></div>
      ${rows}
    </div>`;
  }).join('');
}

function deletePracticeRec(id){
  practiceRecords=practiceRecords.filter(r=>r.id!==id);
  renderPracticeHistory();
}

// ===== ATTEND =====
function renderAttendCheckboxes(){
  const el=document.getElementById('attend-checkboxes');
  document.getElementById('attendDate').value=new Date().toISOString().slice(0,10);
  el.innerHTML=players.map(p=>`
    <label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer">
      <input type="checkbox" id="att-${p.id}" style="width:18px;height:18px;accent-color:var(--gold)">
      <span style="font-size:13px">${p.name}</span>
      <span style="font-size:11px;color:var(--gray)">${p.grade}年</span>
    </label>`).join('');
}

function saveAttend(){
  const date=document.getElementById('attendDate').value;
  const type=document.getElementById('attendType').value;
  if(!date){showToast('⚠ 日付を入力してください');return;}
  const present=players.filter(p=>document.getElementById('att-'+p.id)?.checked).map(p=>p.id);
  if(!present.length){showToast('⚠ 出席した選手を選んでください');return;}
  // 同日同種別は上書き
  attendRecords=attendRecords.filter(r=>!(r.date===date&&r.type===type));
  attendRecords.push({id:'at'+Date.now(),date,type,present});
  renderAttendSummary();
  renderAttendCheckboxes();
  showToast(`✅ ${date} 出席を保存しました`);
}

function renderAttendSummary(){
  const el=document.getElementById('attend-summary');
  if(!attendRecords.length){el.innerHTML='<div class="empty">データなし</div>';return;}
  const total=attendRecords.length;
  el.innerHTML=`<div style="font-size:11px;color:var(--gray);margin-bottom:8px">総練習・試合数：${total}回</div>`+
  players.map(p=>{
    const cnt=attendRecords.filter(r=>r.present.includes(p.id)).length;
    const rate=Math.round(cnt/total*100);
    return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:12px;flex:1">${p.name}</span>
      <div class="bar-wrap" style="max-width:100px"><div class="bar bar-blue" style="width:${rate}%"></div></div>
      <span class="spill ${pillClass(rate)}" style="font-size:13px;width:38px;text-align:right">${rate}%</span>
      <span style="font-size:10px;color:var(--gray)">${cnt}/${total}</span>
    </div>`;
  }).join('');
}

// ===== GAME EVAL =====
function renderGameEvalRows(){
  gameEvalState={};
  const el=document.getElementById('game-eval-rows');
  el.innerHTML=GAME_ITEMS.map((item,idx)=>`
    <div class="eval-row">
      <div class="eval-label">${item}</div>
      <div class="sbwrap">${SYMS.map(s=>`<button class="sb" data-idx="${idx}" data-sym="${s}" onclick="setGameSym(${idx},'${s}',this)">${s}</button>`).join('')}</div>
    </div>`).join('');
}

function setGameSym(idx,sym,btn){
  if(gameEvalState[idx]===sym){delete gameEvalState[idx];}
  else{gameEvalState[idx]=sym;}
  document.querySelectorAll(`.sb[data-idx="${idx}"]`).forEach(b=>{
    b.className='sb';
    if(gameEvalState[idx]&&b.dataset.sym===gameEvalState[idx])b.classList.add(SYM_CLS[gameEvalState[idx]]);
  });
}

function calcGameScore(){
  const keys=Object.keys(gameEvalState);
  if(!keys.length)return null;
  const total=keys.reduce((s,k)=>s+PTS[gameEvalState[k]],0);
  return Math.round(total/(keys.length*3)*100);
}

function saveGameEval(){
  const pid=document.getElementById('gamePlayer').value;
  const date=document.getElementById('gameDate').value||new Date().toISOString().slice(0,10);
  const opp=document.getElementById('gameOpp').value||'不明';
  const comment=document.getElementById('gameComment').value;
  if(!pid){showToast('⚠ 選手を選んでください');return;}
  if(!Object.keys(gameEvalState).length){showToast('⚠ 最低1項目入力してください');return;}
  const total=calcGameScore();
  const scores={...gameEvalState};
  gameRecords.push({id:'gr'+Date.now(),playerId:pid,date,opp,scores,total,comment});
  gameEvalState={};
  renderGameEvalRows();
  document.getElementById('gameComment').value='';
  renderGameHist();
  showToast('✅ 試合評価を保存しました');
}

function refreshGameDropdowns(){
  ['gamePlayer','gameHistPlayer'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    const prev=el.value;
    el.innerHTML=id==='gameHistPlayer'?'<option value="">全選手</option>':'<option value="">選手を選ぶ</option>';
    players.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name}（${p.grade}年）`;el.appendChild(o);});
    if(prev)el.value=prev;
  });
}

function renderGameHist(){
  const pid=document.getElementById('gameHistPlayer').value;
  const el=document.getElementById('game-hist');
  let recs=[...gameRecords].sort((a,b)=>b.date.localeCompare(a.date));
  if(pid)recs=recs.filter(r=>r.playerId===pid);
  if(!recs.length){el.innerHTML='<div class="empty">データなし</div>';return;}
  el.innerHTML=recs.map(r=>{
    const p=players.find(x=>x.id===r.playerId);
    const details=GAME_ITEMS.map((item,i)=>{
      const sym=r.scores[i];
      return sym?`<span style="font-size:10px;color:var(--gray)">${item}：<b style="color:#fff">${sym}</b></span>`:null;
    }).filter(Boolean).join('　');
    return `<div class="card" style="margin-bottom:8px;padding:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div>
          <span style="font-size:13px;font-weight:700">${p?p.name:'不明'}</span>
          <span style="font-size:10px;color:var(--gray);margin-left:6px">${r.date} vs ${r.opp}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="spill ${pillClass(r.total)}">${r.total}%</span>
          <button class="btn-sm btn-sm-red" onclick="deleteGameRec('${r.id}')">×</button>
        </div>
      </div>
      <div style="line-height:1.8">${details}</div>
      ${r.comment?`<div style="font-size:11px;color:var(--gray);margin-top:4px">💬 ${r.comment}</div>`:''}
    </div>`;
  }).join('');
}

function deleteGameRec(id){
  gameRecords=gameRecords.filter(r=>r.id!==id);
  renderGameHist();
}

// ===== GROWTH =====
function setGrowthTab(tab,btn){
  growthTab=tab;
  document.querySelectorAll('#growth-tabs .itab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrowth();
}

function refreshGrowthDropdown(){
  const el=document.getElementById('growthPlayer');
  const prev=el.value;
  el.innerHTML='';
  players.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name}（${p.grade}年）`;el.appendChild(o);});
  if(prev)el.value=prev;
}

function renderGrowth(){
  const pid=document.getElementById('growthPlayer').value;
  const canvas=document.getElementById('growthChart');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||320;
  canvas.height=200;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  let data=[];
  if(growthTab==='practice'){
    data=practiceRecords.filter(r=>r.playerId===pid).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({label:r.date.slice(5),val:r.score}));
  }else if(growthTab==='game'){
    data=gameRecords.filter(r=>r.playerId===pid).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({label:r.date.slice(5)+' '+r.opp,val:r.total}));
  }else{
    // total by date (use all records)
    const dates=[...new Set([...practiceRecords,...attendRecords,...gameRecords].map(r=>r.date))].sort();
    data=dates.map(d=>{
      // snapshot total up to this date
      const pr=practiceRecords.filter(r=>r.playerId===pid&&r.date<=d);
      const at=attendRecords.filter(r=>r.date<=d);
      const gr=gameRecords.filter(r=>r.playerId===pid&&r.date<=d);
      const pAvg=pr.length?Math.round(pr.reduce((s,r)=>s+r.score,0)/pr.length):null;
      const aTotal=attendRecords.filter(r=>r.date<=d).length;
      const aRate=aTotal?Math.round(at.filter(r=>r.present.includes(pid)).length/aTotal*100):null;
      const gAvg=gr.length?Math.round(gr.reduce((s,r)=>s+r.total,0)/gr.length):null;
      let sc=0,w=0;
      if(pAvg!==null){sc+=pAvg*0.4;w+=0.4;}
      if(aRate!==null){sc+=aRate*0.2;w+=0.2;}
      if(gAvg!==null){sc+=gAvg*0.4;w+=0.4;}
      return{label:d.slice(5),val:w>0?Math.round(sc/w):null};
    }).filter(d=>d.val!==null);
  }

  if(data.length<2){
    ctx.fillStyle='#8899aa';ctx.font='13px sans-serif';ctx.textAlign='center';
    ctx.fillText('データが2件以上になると表示されます',canvas.width/2,canvas.height/2);
    return;
  }

  const W=canvas.width,H=canvas.height;
  const pad={t:20,r:20,b:36,l:36};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const maxV=100,minV=0;

  // grid
  [0,25,50,75,100].forEach(v=>{
    const y=pad.t+ch-(v-minV)/(maxV-minV)*ch;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);
    ctx.strokeStyle='rgba(30,48,80,.8)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#8899aa';ctx.font='9px sans-serif';ctx.textAlign='right';
    ctx.fillText(v+'%',pad.l-4,y+3);
  });

  const step=cw/(data.length-1);
  const color=growthTab==='practice'?'#f5a623':growthTab==='game'?'#2dc653':'#3a86ff';

  // line
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=pad.l+i*step;
    const y=pad.t+ch-(d.val-minV)/(maxV-minV)*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();

  // fill
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x=pad.l+i*step;
    const y=pad.t+ch-(d.val-minV)/(maxV-minV)*ch;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.l+(data.length-1)*step,pad.t+ch);
  ctx.lineTo(pad.l,pad.t+ch);
  ctx.closePath();
  ctx.fillStyle=color+'33';ctx.fill();

  // dots + labels
  data.forEach((d,i)=>{
    const x=pad.l+i*step;
    const y=pad.t+ch-(d.val-minV)/(maxV-minV)*ch;
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    ctx.fillStyle='#e8f0f8';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText(d.val+'%',x,y-8);
    ctx.fillStyle='#8899aa';ctx.font='9px sans-serif';
    ctx.fillText(d.label,x,H-pad.b+12);
  });
}

// ===== RANKING =====
function setRankTab(tab,btn){
  rankTab=tab;
  document.querySelectorAll('.itabs .itab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderRanking();
}

function renderRanking(){
  const el=document.getElementById('rank-list');
  let data=players.map(p=>{
    const pr=calcPracticeAvg(p.id);
    const at=calcAttendRate(p.id);
    const gm=calcGameAvg(p.id);
    const tot=calcTotal(p.id);

    let score;
    if(rankTab==='total') score=tot;
    else if(rankTab==='number'){
      // 背番号参考 = 試合評価60% + 練習姿勢40%
      let s=0,w=0;
      if(gm!==null){s+=gm*0.6;w+=0.6;}
      if(pr!==null){s+=pr*0.4;w+=0.4;}
      score=w>0?Math.round(s/w*10)/10:null;
    }else{
      // 出場時間参考 = 試合評価50% + 出席率30% + 練習姿勢20%
      let s=0,w=0;
      if(gm!==null){s+=gm*0.5;w+=0.5;}
      if(at!==null){s+=at*0.3;w+=0.3;}
      if(pr!==null){s+=pr*0.2;w+=0.2;}
      score=w>0?Math.round(s/w*10)/10:null;
    }
    return{p,score,pr,at,gm,tot};
  }).filter(d=>d.score!==null).sort((a,b)=>b.score-a.score);

  const noData=players.filter(p=>calcTotal(p.id)===null);

  if(!data.length){el.innerHTML='<div class="empty">データがありません</div>';return;}

  const labels={total:'総合評価',number:'背番号参考',playtime:'出場時間参考'};
  el.innerHTML=`<div class="card" style="margin-bottom:10px;padding:10px">
    <div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">📌 ${labels[rankTab]}</div>
    ${data.map((d,i)=>{
      const noClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
      return `<div class="rank-card">
        <div class="rank-no ${noClass}">${medal||'#'+(i+1)}</div>
        <div style="flex:1">
          <div class="pname">${d.p.name}</div>
          <div style="font-size:10px;color:var(--gray);margin-top:2px">
            🏋️${d.pr!==null?d.pr+'%':'--'}　📅${d.at!==null?d.at+'%':'--'}　🏀${d.gm!==null?d.gm+'%':'--'}
          </div>
        </div>
        <div class="rank-score">${Math.round(d.score)}<span>pt</span></div>
      </div>`;
    }).join('')}
  </div>`;

  if(noData.length){
    el.innerHTML+=`<div class="card" style="padding:10px">
      <div style="font-size:11px;color:var(--gray)">📋 未評価：${noData.map(p=>p.name).join('、')}</div>
    </div>`;
  }
}

// ===== PLAYERS =====
function renderPlayerList(editId=null){
  const el=document.getElementById('player-list');
  if(!players.length){el.innerHTML='<div class="empty">選手が登録されていません</div>';return;}
  el.innerHTML=players.map(p=>{
    if(editId===p.id){
      return `<div class="pcard">
        <div class="pava">${p.name.trim()[0]}</div>
        <input type="text" id="en-${p.id}" value="${p.name}" style="flex:1">
        <select id="eg-${p.id}">${[1,2,3,4,5,6].map(g=>`<option value="${g}"${p.grade===g?' selected':''}>${g}年</option>`).join('')}</select>
        <button class="btn-sm btn-sm-gold" onclick="saveEditPlayer('${p.id}')">保存</button>
        <button class="btn-sm btn-sm-outline" onclick="renderPlayerList()">取消</button>
      </div>`;
    }
    return `<div class="pcard">
      <div class="pava">${p.name.trim()[0]}</div>
      <div style="flex:1"><div class="pname">${p.name}</div><div class="pgrade">${p.grade}年生</div></div>
      <button class="btn-sm btn-sm-outline" onclick="renderPlayerList('${p.id}')">✏️</button>
      <button class="btn-sm btn-sm-red" onclick="deletePlayer('${p.id}')">削除</button>
    </div>`;
  }).join('');
}

function addPlayer(){
  const name=document.getElementById('newName').value.trim();
  const grade=parseInt(document.getElementById('newGrade').value);
  if(!name){showToast('⚠ 名前を入力してください');return;}
  if(players.find(p=>p.name===name)){showToast('⚠ 同じ名前が既にいます');return;}
  players.push({id:'p'+Date.now(),name,grade});
  document.getElementById('newName').value='';
  renderPlayerList();showToast(`✅ ${name} を追加しました`);
}

function saveEditPlayer(id){
  const name=document.getElementById('en-'+id).value.trim();
  const grade=parseInt(document.getElementById('eg-'+id).value);
  if(!name){showToast('⚠ 名前を入力してください');return;}
  const p=players.find(p=>p.id===id);p.name=name;p.grade=grade;
  renderPlayerList();showToast(`✅ 更新しました`);
}

function deletePlayer(id){
  if(!confirm('削除しますか？'))return;
  players=players.filter(p=>p.id!==id);
  practiceRecords=practiceRecords.filter(r=>r.playerId!==id);
  gameRecords=gameRecords.filter(r=>r.playerId!==id);
  attendRecords.forEach(r=>{r.present=r.present.filter(pid=>pid!==id);});
  renderPlayerList();showToast('削除しました');
}

// ===== TOAST =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded',()=>{
  loadData();
  document.getElementById('gameDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('attendDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('lineDate').value=new Date().toISOString().slice(0,10);
  renderHome();
  renderGameEvalRows();
  refreshGameDropdowns();
  refreshGrowthDropdown();
});
</script>
